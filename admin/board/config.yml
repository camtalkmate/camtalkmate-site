# 글 관리자 페이지(/admin) 설정 — Decap CMS
backend:
  name: github
  repo: camtalkmate/camtalkmate-site
  branch: main
  base_url: https://api.netlify.com   # Netlify가 GitHub 로그인을 대신 처리
  commit_messages:
    create: "글 작성: {{slug}}"
    update: "글 수정: {{slug}}"
    delete: "글 삭제: {{slug}}"
    uploadMedia: "이미지 추가: {{path}}"
    deleteMedia: "이미지 삭제: {{path}}"

locale: ko
site_url: https://camtalkus.com
display_url: https://camtalkus.com
logo_url: https://camtalkus.com/assets/img/icon-192.png

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "posts"
    label: "게시판 글"
    label_singular: "글"
    folder: "board/_posts"
    create: true
    slug: "{{slug}}"
    summary: "{{date}} · {{title}}"
    sort_by: ["date"]
    view_filters:
      - label: "임시 저장만"
        field: draft
        pattern: true
    editor:
      preview: false
    fields:
      - { label: "제목 (검색어가 앞에 오게, 32자 이내)", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "검색 결과 요약 (80~110자)", name: "description", widget: "text", hint: "네이버·구글 검색 결과에 제목 아래 보이는 문장입니다." }
      - { label: "키워드 (쉼표로 5개)", name: "keywords", widget: "string", default: "캠톡커, 캠톡 에이전시, 캠톡 수익, 재택 부업, 캠톡어스" }
      - { label: "주소용 영문 이름 (소문자-하이픈, 예: camtalk-first-week)", name: "slug", widget: "string", hint: "저장 후에는 바꾸지 마세요. 글 주소가 됩니다.", pattern: ["^[a-z0-9-]+$", "영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요"] }
      - { label: "대표 이미지 (목록·카톡 공유 썸네일, 가로 1200×세로 675 권장)", name: "image", widget: "image", required: false, hint: "비우면 기본 이미지가 쓰여요." }
      - { label: "임시 저장 (체크하면 사이트에 안 보임)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "본문", name: "body", widget: "markdown", hint: "소제목은 '제목 2', 강조는 굵게, 요약은 목록을 쓰세요. 공백 빼고 1,300자 이상이 검색에 유리합니다.",
          buttons: ["bold", "italic", "heading-two", "heading-three", "bulleted-list", "numbered-list", "quote", "link"], editor_components: ["image"] }
